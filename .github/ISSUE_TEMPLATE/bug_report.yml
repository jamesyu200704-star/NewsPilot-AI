name: Bug 报告
description: 报告可复现的功能、界面或部署问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请移除 API Key、个人信息和未公开的新闻材料。
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 正常情况下应该发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？不要粘贴私人材料。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
        4. 看到……
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署模式
      options:
        - Vercel Demo / Mock
        - 本地完整模式 / Ollama + Qwen
        - 本地服务端 / OpenAI
        - 不确定或不相关
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NewsPilot 版本
      placeholder: v1.1.0-beta.1
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与系统
      description: 不要填写本地用户名或绝对路径。
      placeholder: Chrome / Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可粘贴已脱敏日志或截图，请勿包含密钥和个人信息。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认内容中不包含 API Key、个人信息或未公开材料。
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 该问题涉及数据丢失。
        - label: 该问题涉及隐私泄露。
        - label: 该问题涉及虚构采访、虚构引语或错误核实。
