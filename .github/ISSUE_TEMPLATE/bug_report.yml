name: Bug 报告
description: 报告可复现的功能、界面或部署问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请移除 API Key、个人信息和未公开的新闻材料。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明实际发生了什么，以及你原本期待的结果。
      placeholder: 清晰、简洁地描述问题。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
        4. 看到……
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 生成模式
      options:
        - Demo / Mock
        - Ollama AI
        - OpenAI
        - 不确定或不相关
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 例如 Windows 11、Node.js 22、Chrome 版本；不要填写本地用户名或绝对路径。
      placeholder: Windows 11 / Node.js 22 / Chrome
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可粘贴已脱敏日志或截图，请勿包含密钥和个人信息。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认内容中不包含 API Key、个人信息或未公开材料。
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
