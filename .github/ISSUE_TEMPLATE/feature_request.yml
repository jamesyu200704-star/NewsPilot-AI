name: 改进建议
description: 提议小型改进或后续方向
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        P3 已进入功能冻结。请优先描述核心用户问题；新 Provider、新工作流、云端账号和非必要大型功能会延后评估。不要上传真实采访或个人材料。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 这个改进完成后，用户应能做到什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 如果有，请说明现有功能为什么不能满足需要。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 这项建议与新闻选题、采访策划或项目开源维护直接相关。
          required: true
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 我确认内容不包含真实受访者身份、联系方式、逐字稿或课程私人材料。
          required: true
