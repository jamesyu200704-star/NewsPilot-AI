name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_GENERATION_MODE: mock
      VITE_EVIDENCE_MODE: mock
      VITE_RESEARCH_MODE: 'false'
      GENERATION_MODE: mock
      SEARCH_PROVIDER: manual
      SEARCH_MODE: mock
      TRANSCRIPTION_PROVIDER: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 运行全量测试
        run: npm test
      - name: 构建生产版本
        run: npm run build
      - name: 校园报道评测
        run: npm run eval:campus
      - name: P1 证据评测
        run: npm run eval:p1
      - name: P2 执行评测
        run: npm run eval:p2
      - name: P3 验证评测
        run: npm run eval:p3
