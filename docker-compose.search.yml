services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: newspilot-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/

volumes:
  searxng-cache:
